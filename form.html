<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h3>以下提供計算某數字平方計算機</h3>
    <form action="/square">
        請輸入整數:<input type="text" name="num"/>
        <button>計算</button>
    </form>
    <h3>以下提供計算兩數字相乘結果計算機</h3>
    <form action="/multiply">
        整數1:<input type="text" name="n1"/>
        整數2:<input type="text" name="n2"/>
        <button>計算</button>
    </form>
</body>
</html>
